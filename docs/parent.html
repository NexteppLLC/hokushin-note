<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>北辰ノート｜親用ダッシュボード</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#172033;--muted:#667085;--line:#d9e0e8;--navy:#1f3b64;--ok:#26835b;--mid:#b7791f;--ng:#c94b4b;--E:#315fa5;--M:#8a4fa6;--J:#c06b3e;--S:#2b8b83;--H:#778a2f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}.top{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.topin{max-width:1180px;margin:auto;display:flex;gap:12px;align-items:center;min-height:64px;padding:10px 18px}.logo{width:38px;height:38px;border-radius:11px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800}.ttl{font-weight:800}.sub{font-size:12px;color:var(--muted)}.grow{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;font:inherit;cursor:pointer}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}.wrap{max-width:1180px;margin:auto;padding:22px 18px 60px}.hero{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}.hero .big{flex:2;min-width:300px;background:linear-gradient(135deg,#1f3b64,#315a89);color:#fff;border-radius:18px;padding:24px}.hero h1{margin:0 0 8px;font-size:25px}.hero .count{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums}.hero .count small{font-size:16px;font-weight:600;opacity:.85}.hero .meta{font-size:13px;opacity:.86;margin-top:10px}.quick{flex:3;min-width:360px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.q{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px}.q span{display:block;font-size:12px;color:var(--muted)}.q b{display:block;font-size:27px;margin-top:4px;font-variant-numeric:tabular-nums}.q small{color:var(--muted)}h2{font-size:18px;margin:28px 0 10px}.subjects{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.sc{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0}.sh{display:flex;align-items:center;gap:7px;font-weight:800}.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}.bar{height:8px;border-radius:999px;background:#edf0f4;overflow:hidden;margin:10px 0 5px}.bar i{display:block;height:100%;background:var(--c);border-radius:999px}.kv{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:7px}.kv b{color:var(--ink);font-variant-numeric:tabular-nums}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.card h3{margin:0 0 10px;font-size:15px}.row{display:flex;align-items:center;gap:10px;margin:8px 0}.row span:first-child{width:145px;color:var(--muted);font-size:13px}.row b{font-variant-numeric:tabular-nums}.empty{background:#fff;border:1px dashed #c8d0da;border-radius:15px;padding:30px;text-align:center;color:var(--muted)}.status{font-size:12px;padding:4px 9px;border-radius:999px;background:#eef2f6;color:#475467}.status.ok{background:#e5f4ec;color:#1e704c}.modal{position:fixed;inset:0;background:rgba(10,20,34,.52);display:grid;place-items:center;padding:16px;z-index:20}.modal[hidden]{display:none}.panel{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:17px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.28)}.panel h2{margin:0 0 7px}.muted{font-size:13px;color:var(--muted);line-height:1.65}.field{display:block;margin:12px 0}.field b{display:block;font-size:13px;margin-bottom:4px}.field input,.field textarea{width:100%;border:1px solid #cdd5df;border-radius:9px;padding:10px 12px;font:inherit}.field textarea{min-height:125px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.warn{background:#fff7e8;border:1px solid #ecd5a2;border-radius:10px;padding:10px 12px;font-size:12px;color:#755214;line-height:1.6}
.task-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:28px 0 10px}.task-head h2{margin:0}.filters{display:flex;gap:6px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:#fff;color:#475467;border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer}.filter.on{background:var(--navy);border-color:var(--navy);color:#fff}.daycard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}.dayhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.dayhead .date{font-weight:800;font-size:16px}.dayhead .dayno{background:#eef2f6;color:#475467;border-radius:999px;padding:4px 8px;font-size:11px}.dayhead .donecount{font-size:12px;color:var(--muted)}.dayhead .mini{width:130px;height:7px;background:#edf0f4;border-radius:999px;overflow:hidden}.dayhead .mini i{display:block;height:100%;background:var(--ok)}.daygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.subcol{border-left:3px solid var(--c);padding-left:10px;min-width:0}.subhead{display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;margin-bottom:7px}.subbadge{display:inline-grid;place-items:center;min-width:25px;height:25px;border-radius:8px;background:color-mix(in srgb,var(--c) 12%,white);color:var(--c);font-size:11px}.taskrow{display:grid;grid-template-columns:23px 1fr auto;gap:7px;align-items:start;padding:8px 0;border-top:1px solid #edf0f4}.taskrow:first-of-type{border-top:0}.tick{width:19px;height:19px;border:2px solid #aeb8c5;border-radius:6px;display:grid;place-items:center;font-size:12px;color:#fff;margin-top:1px}.taskrow.done .tick{background:var(--ok);border-color:var(--ok)}.tasktext{font-size:12px;line-height:1.45;min-width:0}.tasktext .code{font-weight:800;margin-right:5px;color:#344054}.taskrow.done .tasktext{color:#667085}.taskrow.done .tasktext .title{text-decoration:line-through;text-decoration-thickness:1px}.mins{font-size:11px;color:#98a2b3;white-space:nowrap}.task-note{font-size:12px;color:var(--muted);margin:0 0 10px}.noitems{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px;background:#fff}
@media(max-width:1000px){.daygrid{grid-template-columns:repeat(2,1fr)}.subjects{grid-template-columns:repeat(2,1fr)}.quick{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.wrap{padding:15px 11px 40px}.topin{padding:8px 11px}.quick{min-width:100%;grid-template-columns:repeat(2,1fr)}.subjects,.cards,.daygrid{grid-template-columns:1fr}.hero .big{min-width:100%}.q b{font-size:22px}.subcol{border-left:0;border-top:3px solid var(--c);padding:9px 0 0}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
</head>
<body>
<header class="top"><div class="topin"><div class="logo">北</div><div><div class="ttl">北辰ノート　親用ダッシュボード</div><div class="sub">子どもの端末から同期された学習進捗を閲覧</div></div><div class="grow"></div><span id="conn" class="status">未接続</span><button class="btn primary" id="setup">接続設定</button></div></header>
<main class="wrap"><div id="view"><div class="empty">「接続設定」からFirebaseと家族用アカウントを設定してください。</div></div></main>
<div class="modal" id="modal" hidden><div class="panel"><h2>親用ダッシュボードの接続設定</h2><p class="muted">子どもの北辰ノートと同じFirebase Web設定・同じ家族用アカウントを使います。パスワードはこの画面のコードには保存しません。</p><label class="field"><b>Firebase Web設定</b><textarea id="config" placeholder="Firebase Console の firebaseConfig を貼り付け"></textarea></label><div class="actions"><button class="btn" id="save-config">設定を保存</button><button class="btn" id="clear-config">設定を消す</button></div><label class="field"><b>メールアドレス</b><input type="email" id="email" autocomplete="username"></label><label class="field"><b>パスワード</b><input type="password" id="password" autocomplete="current-password"></label><div class="actions"><button class="btn primary" id="login">ログイン</button><button class="btn" id="logout">ログアウト</button><button class="btn" id="close">閉じる</button></div><p id="account" class="muted"></p><div class="warn">Firestoreはログインした本人の <b>users/{uid}</b> 配下だけ読み書きできる設定を使用します。項目別同期で送るのは予定のコード・項目名・時間・完了状態です。問題文・解答・付箋・手書きデータは送りません。</div></div></div>
<script>
'use strict';
const CKEY='hn-cloud-config-v1';
const SUBJECT_ORDER=['E','M','J','S','H'];
let app=null,auth=null,db=null,unsubSummary=null,unsubSchedule=null,summary=null,schedule=null,taskFilter='today';
const $=s=>document.querySelector(s);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getConfig(){try{return JSON.parse(localStorage.getItem(CKEY)||'null')}catch(e){return null}}
function parseConfig(text){text=(text||'').trim();if(!text)return null;try{return JSON.parse(text)}catch(e){}let m=text.match(/firebaseConfig\s*=\s*(\{[\s\S]*?\})\s*;/);if(m)return Function('"use strict";return ('+m[1]+')')();m=text.match(/\{[\s\S]*\}/);if(!m)throw new Error('firebaseConfig が見つかりません');return Function('"use strict";return ('+m[0]+')')()}
function setConn(text,ok){$('#conn').textContent=text;$('#conn').className='status'+(ok?' ok':'')}
function pct(a,b){return b?Math.round((Number(a)||0)/(Number(b)||0)*100):0}
function fmtMin(m){m=Number(m)||0;return m>=60?(Math.floor(m/60)+'時間'+(m%60?m%60+'分':'')):m+'分'}
function fmtTime(ms){if(!ms)return'—';const d=new Date(ms);return d.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function remain(day){if(!day)return null;const a=new Date(),b=new Date(day+'T00:00:00+09:00');return Math.ceil((b-a)/86400000)}
function addDays(iso,n){const d=new Date(iso+'T12:00:00+09:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekStart(iso){const d=new Date(iso+'T12:00:00+09:00'),diff=(d.getDay()+6)%7;return addDays(iso,-diff)}
function todayKey(){if(summary&&summary.today)return summary.today;const d=new Date(Date.now()+9*3600000);return d.toISOString().slice(0,10)}
function summaryHTML(s){const r=remain(s.testDay),o=s.overall||{},p=s.plan||{},a=s.actualStudy||{},h=s.studyHistory||{},subs=Object.values(s.subjects||{});return '<section class="hero"><div class="big"><h1>'+esc(s.editionName||'北辰テスト')+'</h1><div class="count">'+(r==null?'—':Math.max(0,r))+'<small> 日</small></div><div>本番まで</div><div class="meta">最終学習 '+fmtTime(s.lastActivityAt)+' ／ 同期 '+fmtTime(s.clientUpdatedAt)+'</div></div><div class="quick"><div class="q"><span>今日までの予定</span><b>'+pct(p.dueDone,p.dueTotal)+'%</b><small>'+(p.dueDone||0)+' / '+(p.dueTotal||0)+'項目</small></div><div class="q"><span>全期間の予定</span><b>'+pct(p.done,p.total)+'%</b><small>'+(p.done||0)+' / '+(p.total||0)+'項目</small></div><div class="q"><span>問題の進み</span><b>'+pct(o.graded,o.items)+'%</b><small>'+(o.graded||0)+' / '+(o.items||0)+'問</small></div><div class="q"><span>最新○率</span><b>'+pct(o.ok,o.graded)+'%</b><small>×△ '+(o.ng||0)+'問</small></div><div class="q"><span>今日の実学習</span><b>'+fmtMin(a.todayMinutes||0)+'</b><small>手入力記録</small></div><div class="q"><span>直近7日の実学習</span><b>'+fmtMin(a.last7Minutes||0)+'</b><small>手入力記録</small></div></div></section><h2>教科ごとの進捗</h2><section class="subjects">'+subs.map(x=>{const pp=(p.bySubject||{})[x.key]||{};return '<div class="sc" style="--c:var(--'+esc(x.key)+')"><div class="sh"><i class="dot"></i>'+esc(x.name)+'</div><div class="bar"><i style="width:'+pct(x.graded,x.items)+'%"></i></div><div class="kv"><span>問題の進み</span><b>'+pct(x.graded,x.items)+'%</b></div><div class="kv"><span>最新○率</span><b>'+pct(x.ok,x.graded)+'%</b></div><div class="kv"><span>×△</span><b>'+(x.ng||0)+'問</b></div><div class="kv"><span>予定完了</span><b>'+pct(pp.done,pp.total)+'%</b></div></div>'}).join('')+'</section><h2>学習の質</h2><section class="cards"><div class="card"><h3>初見・後日再テスト</h3><div class="row"><span>初見の○率</span><b>'+(h.first?pct(h.firstOk,h.first)+'%':'—')+'</b></div><div class="row"><span>初見</span><b>'+(h.firstOk||0)+' / '+(h.first||0)+'問 ○</b></div><div class="row"><span>後日再テスト○率</span><b>'+(h.retest?pct(h.retestOk,h.retest)+'%':'—')+'</b></div><div class="row"><span>復習時期</span><b>'+(h.due||0)+'問</b></div></div><div class="card"><h3>全体</h3><div class="row"><span>取り組み済み単元</span><b>'+(o.unitsDone||0)+' / '+(o.units||0)+'</b></div><div class="row"><span>採点済み</span><b>'+(o.graded||0)+' / '+(o.items||0)+'問</b></div><div class="row"><span>○</span><b>'+(o.ok||0)+'問</b></div><div class="row"><span>×△</span><b>'+(o.ng||0)+'問</b></div></div></section>'}
function filteredDays(){const days=(schedule&&schedule.days)||[],today=todayKey(),yesterday=addDays(today,-1),ws=weekStart(today),we=addDays(ws,6);if(taskFilter==='today')return days.filter(d=>d.date===today);if(taskFilter==='yesterday')return days.filter(d=>d.date===yesterday);if(taskFilter==='week')return days.filter(d=>d.date>=ws&&d.date<=we);if(taskFilter==='todo')return days.filter(d=>d.date<=today&&(d.tasks||[]).some(t=>!t.done));return days}
function taskSectionHTML(){const filters=[['today','今日'],['yesterday','昨日'],['week','今週'],['todo','未完了'],['all','全日程']];let html='<div class="task-head"><h2>項目別の進捗</h2><span class="grow"></span><div class="filters">'+filters.map(([k,l])=>'<button class="filter '+(taskFilter===k?'on':'')+'" data-filter="'+k+'">'+l+'</button>').join('')+'</div></div><p class="task-note">子どもの「日程」のチェック状態を閲覧専用で表示します。未完了は今日以前の項目だけを表示します。</p>';if(!schedule||!(schedule.days||[]).length)return html+'<div class="noitems">項目別データはまだありません。子どものiPadで北辰ノートを最新版に更新し、「設定 → 親PCとの同期 → 今すぐ同期」を押してください。</div>';const days=filteredDays();if(!days.length)return html+'<div class="noitems">この条件に該当する予定はありません。</div>';html+=days.map(day=>dayHTML(day)).join('');return html}
function dayHTML(day){let tasks=day.tasks||[];if(taskFilter==='todo')tasks=tasks.filter(t=>!t.done);const total=tasks.length,done=tasks.filter(t=>t.done).length;const groups={};tasks.forEach(t=>{(groups[t.subjectKey]=groups[t.subjectKey]||[]).push(t)});return '<section class="daycard"><div class="dayhead"><span class="date">'+esc(day.date.slice(5).replace('-','/'))+'（'+esc(day.weekday||'')+'）</span><span class="dayno">Day '+esc(day.day)+'</span>'+(day.holiday?'<span class="dayno">'+esc(day.holiday)+'</span>':'')+'<span class="grow"></span><span class="mini"><i style="width:'+pct(done,total)+'%"></i></span><span class="donecount">'+done+' / '+total+' 完了</span></div><div class="daygrid">'+SUBJECT_ORDER.map(sk=>{const list=groups[sk]||[];if(!list.length)return'';const first=list[0];return '<div class="subcol" style="--c:var(--'+esc(sk)+')"><div class="subhead"><span class="subbadge">'+esc(first.subjectShort||sk)+'</span>'+esc(first.subjectName||'')+'</div>'+list.map(taskRowHTML).join('')+'</div>'}).join('')+'</div></section>'}
function taskRowHTML(t){return '<div class="taskrow '+(t.done?'done':'')+'"><span class="tick">'+(t.done?'✓':'')+'</span><div class="tasktext"><span class="code">'+esc(t.code)+'</span><span class="title">'+esc(t.title)+'</span></div><span class="mins">'+esc(t.minutes||0)+'分</span></div>'}
function render(){if(!summary){$('#view').innerHTML='<div class="empty">まだ同期データがありません。子どもの北辰ノートで「今すぐ同期」を実行してください。</div>';return}$('#view').innerHTML=summaryHTML(summary)+taskSectionHTML();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{taskFilter=b.dataset.filter;render()})}
function stopWatch(){if(unsubSummary){unsubSummary();unsubSummary=null}if(unsubSchedule){unsubSchedule();unsubSchedule=null}}
function watch(){stopWatch();if(!auth||!auth.currentUser||!db)return;setConn('同期中',true);const base=db.collection('users').doc(auth.currentUser.uid).collection('hokushin');unsubSummary=base.doc('current').onSnapshot(doc=>{summary=doc.exists?doc.data():null;setConn('接続済み',true);render()},e=>{setConn('読込エラー',false);$('#view').innerHTML='<div class="empty">Firestoreを読み込めません：'+esc(e.message)+'</div>'});unsubSchedule=base.doc('schedule').onSnapshot(doc=>{schedule=doc.exists?doc.data():null;render()},e=>{console.warn('schedule read failed',e);schedule=null;render()})}
async function init(){const c=getConfig();$('#config').value=c?JSON.stringify(c,null,2):'';if(!c||!c.apiKey||!c.projectId){setConn('未設定',false);return}try{app=firebase.apps.length?firebase.app():firebase.initializeApp(c);auth=firebase.auth();db=firebase.firestore();await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});auth.onAuthStateChanged(u=>{$('#account').textContent=u?'ログイン中：'+(u.email||u.uid):'未ログインです';if(u)watch();else{setConn('ログイン待ち',false);stopWatch();summary=null;schedule=null}})}catch(e){setConn('設定エラー',false);$('#account').textContent=e.message}}
$('#setup').onclick=()=>{$('#config').value=getConfig()?JSON.stringify(getConfig(),null,2):'';$('#modal').hidden=false};$('#close').onclick=()=>$('#modal').hidden=true;
$('#save-config').onclick=()=>{try{const c=parseConfig($('#config').value);if(!c||!c.apiKey||!c.projectId)throw new Error('apiKey / projectId を確認してください');localStorage.setItem(CKEY,JSON.stringify(c));alert('Firebase設定を保存しました。再読み込みします。');location.reload()}catch(e){alert('保存できません：'+e.message)}};
$('#clear-config').onclick=()=>{if(confirm('このPCのFirebase設定を消しますか？')){localStorage.removeItem(CKEY);location.reload()}};
$('#login').onclick=async()=>{if(!auth){alert('先にFirebase設定を保存してください');return}try{await auth.signInWithEmailAndPassword($('#email').value.trim(),$('#password').value);$('#password').value='';$('#modal').hidden=true}catch(e){alert('ログインできません：'+e.message)}};
$('#logout').onclick=async()=>{if(auth)await auth.signOut()};
init();
</script>
</body>
</html>
