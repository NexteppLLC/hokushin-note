" y="42" font-size="18" text-anchor="middle" fill="#182b40">緑色の部分</text><text x="450" y="42" font-size="18" text-anchor="middle" fill="#182b40">白いふの部分</text><text x="600" y="124" font-size="17" text-anchor="middle" fill="#182b40">光あり</text><text x="608" y="231" font-size="17" text-anchor="middle" fill="#182b40">光なし</text><text x="330" y="318" font-size="17" text-anchor="middle" fill="#182b40">下半分は両面をアルミニウムはくでおおった。</text><text x="340" y="353" font-size="14" text-anchor="middle" fill="#526277">自作の学習用模式図・数値は設問用</text></g></svg>