<svg xmlns="http://www.w3.org/2000/svg" width="710" height="440" viewBox="0 0 710 440" role="img" aria-label="顕微鏡の視野と観察条件。像は左下にある。"><title>顕微鏡の視野と観察条件。像は左下にある。</title><defs><marker id="sci-visual_microscope-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#263548"/></marker><pattern id="sci-visual_microscope-hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-1,1 L1,-1 M0,7 L7,0 M6,8 L8,6" stroke="#66788d" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="17" fill="#182b40" stroke-linecap="round" stroke-linejoin="round"><circle cx="208" cy="211" r="133" fill="#f6faff" stroke="#263548" stroke-width="2"/><line x1="75" y1="211" x2="341" y2="211" stroke="#c0ccda" stroke-width="1" stroke-dasharray="5 5"/><line x1="208" y1="78" x2="208" y2="344" stroke="#c0ccda" stroke-width="1" stroke-dasharray="5 5"/><ellipse cx="155" cy="266" rx="27" ry="16" fill="#c8dcec" stroke="#263548" stroke-width="2"/><circle cx="155" cy="266" r="6" fill="#667f97" stroke="#263548" stroke-width="2"/><text x="208" y="49" font-size="20" text-anchor="middle" font-weight="bold" fill="#182b40">今の視野</text><text x="208" y="385" font-size="17" text-anchor="middle" fill="#182b40">像を中央へ移したい</text><rect x="397" y="91" width="261" height="208" rx="12" fill="#edf5fc" stroke="#263548" stroke-width="2"/><text x="527" y="132" font-size="16" text-anchor="middle" fill="#182b40">接眼：10倍</text><text x="527" y="175" font-size="16" text-anchor="middle" fill="#182b40">対物：10倍 → 40倍</text><text x="527" y="218" font-size="16" text-anchor="middle" fill="#182b40">100倍の視野直径：1.8 mm</text><text x="527" y="261" font-size="16" text-anchor="middle" fill="#182b40">400倍では直径に細胞3個</text><text x="355" y="428" font-size="14" text-anchor="middle" fill="#526277">自作の学習用模式図・数値は設問用</text></g></svg>