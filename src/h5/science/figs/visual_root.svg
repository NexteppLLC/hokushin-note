<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-label="根の成長の観察。等間隔の印の変化と根の部位。"><title>根の成長の観察。等間隔の印の変化と根の部位。</title><defs><marker id="sci-visual_root-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#263548"/></marker><pattern id="sci-visual_root-hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-1,1 L1,-1 M0,7 L7,0 M6,8 L8,6" stroke="#66788d" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="17" fill="#182b40" stroke-linecap="round" stroke-linejoin="round"><text x="140" y="35" font-size="20" text-anchor="middle" font-weight="bold" fill="#182b40">観察前</text><path d="M112,55 L112,193 Q140,237 168,193 L168,55" fill="#eff6fc" stroke="#263548" stroke-width="2"/><line x1="112" y1="75" x2="168" y2="75" stroke="#263548" stroke-width="2.5"/><text x="97" y="80" font-size="17" text-anchor="middle" fill="#182b40">1</text><line x1="112" y1="100" x2="168" y2="100" stroke="#263548" stroke-width="2.5"/><text x="97" y="105" font-size="17" text-anchor="middle" fill="#182b40">2</text><line x1="112" y1="125" x2="168" y2="125" stroke="#263548" stroke-width="2.5"/><text x="97" y="130" font-size="17" text-anchor="middle" fill="#182b40">3</text><line x1="112" y1="150" x2="168" y2="150" stroke="#263548" stroke-width="2.5"/><text x="97" y="155" font-size="17" text-anchor="middle" fill="#182b40">4</text><line x1="112" y1="175" x2="168" y2="175" stroke="#263548" stroke-width="2.5"/><text x="97" y="180" font-size="17" text-anchor="middle" fill="#182b40">5</text><text x="140" y="251" font-size="16" text-anchor="middle" fill="#182b40">根の先端</text><text x="400" y="35" font-size="20" text-anchor="middle" font-weight="bold" fill="#182b40">1日後</text><path d="M372,55 L372,248 Q400,292 428,248 L428,55" fill="#eff6fc" stroke="#263548" stroke-width="2"/><line x1="372