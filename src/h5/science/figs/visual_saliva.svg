<svg xmlns="http://www.w3.org/2000/svg" width="690" height="310" viewBox="0 0 690 310" role="img" aria-label="だ液実験。試験管から二つの試料を分けて検査。"><title>だ液実験。試験管から二つの試料を分けて検査。</title><defs><marker id="sci-visual_saliva-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#263548"/></marker><pattern id="sci-visual_saliva-hatch" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M-1,1 L1,-1 M0,7 L7,0 M6,8 L8,6" stroke="#66788d" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK JP, Noto Sans JP, Yu Gothic, sans-serif" font-size="17" fill="#182b40" stroke-linecap="round" stroke-linejoin="round"><rect x="34" y="85" width="156" height="84" rx="12" fill="#edf5fc" stroke="#263548" stroke-width="2"/><text x="112" y="118" font-size="19" text-anchor="middle" fill="#182b40">デンプン液</text><text x="112" y="147" font-size="16" text-anchor="middle" fill="#182b40">＋だ液または水</text><line x1="195" y1="128" x2="270" y2="128" stroke="#263548" stroke-width="2" marker-end="url(#sci-visual_saliva-arrow)"/><text x="231" y="94" font-size="17" text-anchor="middle" fill="#182b40">保温</text><rect x="282" y="80" width="118" height="98" rx="12" fill="white" stroke="#263548" stroke-width="2"/><text x="341" y="119" font-size="18" text-anchor="middle" fill="#182b40">別々の</text><text x="341" y="147" font-size="18" text-anchor="middle" fill="#182b40">試験管へ</text><line x1="404" y1="105" x2="460" y2="74" stroke="#263548" stroke-width="2" marker-end="url(#sci-visual_saliva-arrow)"/><line x1="404" y1="154" x2="460" y2="216" stroke="#263548" stroke-width="2" marker-end="url(#sci-visual_saliva-arrow)"/><rect x="470" y="38" width="184" height="72" rx="10" fill="#edf5fc" stroke="#263548" stroke-width="2"/><text x="562" y="66" font-size="18" text-anchor="middle" fill="#182b40">ヨウ素液</text><text x="562" y="94" font-size="16" text-anchor="middle" fill="#182b40">デンプンを調べる</text><rect x="470" y="180" width="184" height="82" rx="10" fill="#edf5fc" stroke="#263548" stroke-width="2"/><text x="562" y="207" font-size="18" text-anchor="middle" fill="#182b40">ベネジクト液</text><text x="562" y="232" font-size="16" text-anchor="middle" fill="#182b40">加熱して糖を調べる</text><text x="223" y="263" font-size="16" text-anchor="middle" fill="#182b40">同じ試料に2種類の薬品を順番に加えない。</text><text x="345" y="298" font-size="14" text-anchor="middle" fill="#526277">自作の学習用模式図・数値は設問用</text></g></svg>