<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 425" role="img" aria-label="1890年45万人、1928年1241万人、1946年3688万人の有権者数の棒グラフ"><title>1890年45万人、1928年1241万人、1946年3688万人の有権者数の棒グラフ</title><rect width="100%" height="100%" fill="white"/><text x="22" y="32" font-family="sans-serif" font-size="23" text-anchor="start" fill="#203647" font-weight="bold">資料 A　衆議院総選挙の有権者数</text><text x="670" y="67" font-family="sans-serif" font-size="16" text-anchor="end" fill="#203647" font-weight="normal">万人</text><line x1="132.0" x2="132.0" y1="90" y2="310" stroke="#cbd5df"/><text x="132.0" y="338" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#203647" font-weight="normal">0</text><line x1="258.0" x2="258.0" y1="90" y2="310" stroke="#cbd5df"/><text x="258.0" y="338" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#203647" font-weight="normal">1000</text><line x1="384.0" x2="384.0" y1="90" y2="310" stroke="#cbd5df"/><text x="384.0" y="338" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#203647" font-weight="normal">2000</text><line x1="510.0" x2="510.0" y1="90" y2="310" stroke="#cbd5df"/><text x="510.0" y="338" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#203647" font-weight="normal">3000</text><line x1="636.0" x2="636.0" y1="90" y2="310" stroke="#cbd5df"/><text x="636.0" y="338" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#203647" font-weight="normal">4000</text><text x="116" y="132" font-family="sans-serif" font-size="20" text-anchor="end" fill="#203647" font-weight="normal">1890年</text><rect x="132" y="105" width="5.67" height="42" fill="#347994"/><text x="146.67" y="133" font-family="sans-serif" font-size="19" text-anchor="start" fill="#203647" font-weight="normal">45</text><text x="116" y="207" font-family="sans-serif" font-size="20" text-anchor="end" fill="#203647" font-weight="normal">1928年</text><rect x="132" y="180" width="156.366" height="42" fill="#347994"/><text x="297.366" y="208" font-family="sans-serif" font-size="19" text-anchor="start" fill="#203647" font-weight="normal">1,241</text><text x="116" y="282" font-family="sans-serif" font-size="20" text-anchor="end" fill="#203647" font-weight="normal">1946年</text><rect x="132" y="255" width="464.688" height="42" fill="#347994"/><text x="605.688" y="283" font-family="sans-serif" font-size="19" text-anchor="start" fill="#203647" font-weight="normal">3,688</text><text x="22" y="375" font-family="sans-serif" font-size="16" text-anchor="start" fill="#203647" font-weight="normal">人数は万人単位に丸めた値。投票した人数・投票率とは異なる。</text><text x="22" y="400" font-family="sans-serif" font-size="14" text-anchor="start" fill="#203647" font-weight="normal">出典：静岡県総合教育センター「わが国の選挙権の拡大」。</text></svg>