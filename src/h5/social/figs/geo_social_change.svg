<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="geo_social_change_title geo_social_change_desc"><title id="geo_social_change_title">年齢構成と情報利用の資料</title><desc id="geo_social_change_desc">自作の学習用模式図・統計。実在地点の測量図や実測統計ではありません。</desc><rect width="800" height="480" fill="white"/><g font-family="Noto Sans CJK JP, Yu Gothic, IPAexGothic, sans-serif"><text x="25" y="30" font-size="22" text-anchor="start" fill="#172b3a">ある市の人口と情報利用（学習用統計）</text><text x="30" y="70" font-size="19" text-anchor="start" fill="#172b3a">資料A　年齢3区分の構成（％）</text><text x="30" y="110" font-size="18" text-anchor="start" fill="#172b3a">2005年：人口10万人</text><rect x="40" y="125" width="144.0" height="50" fill="#99c7dc" stroke="white" stroke-width="1"/><text x="112.0" y="156" font-size="16" text-anchor="middle" fill="#172b3a"> 20%</text><rect x="184.0" y="125" width="468.0" height="50" fill="#e5c083" stroke="white" stroke-width="1"/><text x="418.0" y="156" font-size="16" text-anchor="middle" fill="#172b3a"> 65%</text><rect x="652.0" y="125" width="108.0" height="50" fill="#b3cba9" stroke="white" stroke-width="1"/><text x="706.0" y="156" font-size="16" text-anchor="middle" fill="#172b3a"> 15%</text><text x="30" y="210" font-size="18" text-anchor="start" fill="#172b3a">2025年：人口8万人</text><rect x="40" y="225" width="72.0" height="50" fill="#99c7dc" stroke="white" stroke-width="1"/><text x="76.0" y="256" font-size="16" text-anchor="middle" fill="#172b3a"> 10%</text><rect x="112.0" y="225" width="396.0" height="50" fill="#e5c083" stroke="white" stroke-width="1"/><text x="310.0" y="256" font-size="16" text-anchor="middle" fill="#172b3a"> 55%</text><rect x="508.0" y="225" width="252.0" height="50" fill="#b3cba9" stroke="white" stroke-width="1"/><text x="634.0" y="256" font-size="16" text-anchor="middle" fill="#172b3a"> 35%</text><text x="40" y="305" font-size="17" text-anchor="start" fill="#172b3a">凡例：青＝0〜14歳　黄＝15〜64歳　緑＝65歳以上</text><rect x="30" y="325" width="740" height="125" fill="#f0f7fc" stroke="#94a3b8" stroke-width="1"/><text x="42" y="351" font-size="17" text-anchor="start" fill="#172b3a">資料B　市の広報の受け取り方（2025年）</text><text x="42" y="376" font-size="17" text-anchor="start" fill="#172b3a">インターネットを使う：70％／使わない：30％</text><text x="42" y="401" font-size="17" text-anchor="start" fill="#172b3a">市は印刷費を減らすため、広報をウェブ配信だけにする案を検討。</text><text x="42" y="426" font-size="17" text-anchor="start" fill="#172b3a">ある住民は「端末がない人にも必要な情報を届けてほしい」と発言。</text></g></svg>