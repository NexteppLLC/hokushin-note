<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" role="img" aria-labelledby="geo_consensus_title geo_consensus_desc"><title id="geo_consensus_title">利用希望と配分案の比較</title><desc id="geo_consensus_desc">自作の学習用模式図・統計。実在地点の測量図や実測統計ではありません。</desc><rect width="800" height="510" fill="white"/><g font-family="Noto Sans CJK JP, Yu Gothic, IPAexGothic, sans-serif"><text x="25" y="30" font-size="22" text-anchor="start" fill="#172b3a">体育館の利用希望と3つの案</text><rect x="30" y="60" width="740" height="80" fill="#f0f7fc" stroke="#94a3b8" stroke-width="1"/><text x="42" y="86" font-size="17" text-anchor="start" fill="#172b3a">同じ放課後の体育館を、バスケ部30人・バレー部20人が希望。</text><text x="42" y="111" font-size="17" text-anchor="start" fill="#172b3a">体育館は半面ずつ同時利用できる。毎週の利用枠は計10枠。</text><rect x="30" y="165" width="740" height="80" fill="#f4f7fa" stroke="#94a3b8" stroke-width="1"/><text x="42" y="191" font-size="17" text-anchor="start" fill="#172b3a">案A</text><text x="42" y="216" font-size="17" text-anchor="start" fill="#172b3a">バスケ部が10枠すべて使用</text><text x="42" y="241" font-size="17" text-anchor="start" fill="#172b3a">バレー部の意見を聞かず決定</text><rect x="30" y="260" width="740" height="80" fill="#fdf4e6" stroke="#94a3b8" stroke-width="1"/><text x="42" y="286" font-size="17" text-anchor="start" fill="#172b3a">案B</text><text x="42" y="311" font-size="17" text-anchor="start" fill="#172b3a">希望を聞き、半面ずつ10枠共有</text><text x="42" y="336" font-size="17" text-anchor="start" fill="#172b3a">待ち時間と使わない面を減らす</text><rect x="30" y="355" width="740" height="80" fill="#f4f7fa" stroke="#94a3b8" stroke-width="1"/><text x="42" y="381" font-size="17" text-anchor="start" fill="#172b3a">案C</text><text x="42" y="406" font-size="17" text-anchor="start" fill="#172b3a">部長2人だけでくじを引く</text><text x="42" y="431" font-size="17" text-anchor="start" fill="#172b3a">当選した部だけが10枠を独占</text><text x="30" y="480" font-size="17" text-anchor="start" fill="#172b3a">合意に向けて、設備の安全性・競技ごとの必要面積も確認する。</text></g></svg>