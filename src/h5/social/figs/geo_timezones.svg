<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="geo_timezones_title geo_timezones_desc"><title id="geo_timezones_title">標準時子午線の位置図</title><desc id="geo_timezones_desc">自作の学習用模式図・統計。実在地点の測量図や実測統計ではありません。</desc><rect width="800" height="450" fill="white"/><g font-family="Noto Sans CJK JP, Yu Gothic, IPAexGothic, sans-serif"><text x="25" y="30" font-size="22" text-anchor="start" fill="#172b3a">各地域が使う標準時子午線</text><text x="25" y="65" font-size="18" text-anchor="start" fill="#172b3a">サマータイムは考えない。都市そのものの経度ではない。</text><line x1="50" y1="155" x2="755" y2="155" stroke="#2c677f" stroke-width="3"/><path d="M 744.8683290659683 159.28360176539516 L 755 155 L 744.8683290659683 150.71639823460484" stroke="#2c677f" stroke-width="3" fill="none"/><text x="675" y="137" font-size="18" text-anchor="start" fill="#172b3a">東へ</text><line x1="90.0" y1="110" x2="90.0" y2="235" stroke="#477990" stroke-width="2"/><text x="90.0" y="100" font-size="18" text-anchor="middle" fill="#172b3a">西経120°</text><text x="90.0" y="270" font-size="23" text-anchor="middle" fill="#172b3a">L</text><line x1="195.88235294117646" y1="110" x2="195.88235294117646" y2="235" stroke="#477990" stroke-width="2"/><text x="195.88235294117646" y="100" font-size="18" text-anchor="middle" fill="#172b3a">西経75°</text><text x="195.88235294117646" y="270" font-size="23" text-anchor="middle" fill="#172b3a">N</text><line x1="372.3529411764706" y1="110" x2="372.3529411764706" y2="235" stroke="#477990" stroke-width="2"/><text x="372.3529411764706" y="100" font-size="18" text-anchor="middle" fill="#172b3a">0°</text><text x="372.3529411764706" y="270" font-size="23" text-anchor="middle" fill="#172b3a">G</text><line x1="690.0" y1="110" x2="690.0" y2="235" stroke="#477990" stroke-width="2"/><text x="690.0" y="100" font-size="18" text-anchor="middle" fill="#172b3a">東経135°</text><text x="690.0" y="270" font-size="23" text-anchor="middle" fill="#172b3a">J</text><rect x="30" y="310" width="740" height="110" fill="#f0f7fc" stroke="#94a3b8" stroke-width="1"/><text x="42" y="336" font-size="17" text-anchor="start" fill="#172b3a">日本J：1月1日 午前9時</text><text x="42" y="361" font-size="17" text-anchor="start" fill="#172b3a">飛行機：Jを1月1日 午前10時に出発し、12時間後にLへ到着。</text><text x="42" y="386" font-size="17" text-anchor="start" fill="#172b3a">地球は24時間で360°回転する。1時間に相当する経度差を考える。</text></g></svg>