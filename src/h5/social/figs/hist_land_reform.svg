<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 725 428" role="img" aria-label="学習用モデル、改革前は自作地40ha小作地60ha、改革後は自作地90ha小作地10ha"><title>学習用モデル、改革前は自作地40ha小作地60ha、改革後は自作地90ha小作地10ha</title><rect width="100%" height="100%" fill="white"/><text x="22" y="32" font-family="sans-serif" font-size="23" text-anchor="start" fill="#203647" font-weight="bold">資料 A　ある地域の自作地・小作地</text><text x="22" y="58" font-family="sans-serif" font-size="15" text-anchor="start" fill="#203647" font-weight="normal">農地改革のしくみを考えるための学習用モデル。全国の実測統計ではない。</text><text x="120" y="141" font-family="sans-serif" font-size="20" text-anchor="end" fill="#203647" font-weight="normal">改革前</text><rect x="143" y="110" width="200" height="50" fill="#287b85"/><rect x="343" y="110" width="300" height="50" fill="#e2b05e"/><text x="243.0" y="141" font-family="sans-serif" font-size="19" text-anchor="middle" fill="white" font-weight="normal">40 ha</text><text x="493.0" y="141" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#203647" font-weight="normal">60 ha</text><text x="120" y="236" font-family="sans-serif" font-size="20" text-anchor="end" fill="#203647" font-weight="normal">改革後</text><rect x="143" y="205" width="450" height="50" fill="#287b85"/><rect x="593" y="205" width="50" height="50" fill="#e2b05e"/><text x="368.0" y="236" font-family="sans-serif" font-size="19" text-anchor="middle" fill="white" font-weight="normal">90 ha</text><text x="618.0" y="236" font-family="sans-serif" font-size="18" text-anchor="middle" fill="#203647" font-weight="normal">10 ha</text><text x="143" y="288" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#203647" font-weight="normal">0</text><text x="243" y="288" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#203647" font-weight="normal">20</text><text x="343" y="288" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#203647" font-weight="normal">40</text><text x="443" y="288" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#203647" font-weight="normal">60</text><text x="543" y="288" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#203647" font-weight="normal">80</text><text x="643" y="288" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#203647" font-weight="normal">100</text><text x="673" y="288" font-family="sans-serif" font-size="16" text-anchor="start" fill="#203647" font-weight="normal">ha</text><rect x="151" y="322" width="22" height="22" fill="#287b85"/><text x="182" y="339" font-family="sans-serif" font-size="18" text-anchor="start" fill="#203647" font-weight="normal">自作地</text><rect x="303" y="322" width="22" height="22" fill="#e2b05e"/><text x="334" y="339" font-family="sans-serif" font-size="18" text-anchor="start" fill="#203647" font-weight="normal">小作地</text><text x="22" y="378" font-family="sans-serif" font-size="16" text-anchor="start" fill="#203647" font-weight="normal">両年の総面積は100 ha。自作地＝耕作者が所有する土地。</text><text x="22" y="402" font-family="sans-serif" font-size="16" text-anchor="start" fill="#203647" font-weight="normal">小作地＝耕作者が地主から借りている土地。</text></svg>