<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="geo_share_total_title geo_share_total_desc"><title id="geo_share_total_title">工業出荷額の割合と総額</title><desc id="geo_share_total_desc">自作の学習用模式図・統計。実在地点の測量図や実測統計ではありません。</desc><rect width="800" height="400" fill="white"/><g font-family="Noto Sans CJK JP, Yu Gothic, IPAexGothic, sans-serif"><text x="25" y="30" font-size="22" text-anchor="start" fill="#172b3a">工業製品出荷額の構成（学習用データ）</text><text x="30" y="90" font-size="20" text-anchor="start" fill="#172b3a">2015年　総額200億円</text><rect x="40" y="110" width="288.0" height="50" fill="#8dbcd2" stroke="white" stroke-width="1"/><text x="184.0" y="141" font-size="16" text-anchor="middle" fill="#172b3a">機械 40%</text><rect x="328.0" y="110" width="216.0" height="50" fill="#f3cf95" stroke="white" stroke-width="1"/><text x="436.0" y="141" font-size="16" text-anchor="middle" fill="#172b3a">食品 30%</text><rect x="544.0" y="110" width="216.0" height="50" fill="#d1dcda" stroke="white" stroke-width="1"/><text x="652.0" y="141" font-size="16" text-anchor="middle" fill="#172b3a">その他 30%</text><text x="30" y="230" font-size="20" text-anchor="start" fill="#172b3a">2025年　総額300億円</text><rect x="40" y="250" width="216.0" height="50" fill="#8dbcd2" stroke="white" stroke-width="1"/><text x="148.0" y="281" font-size="16" text-anchor="middle" fill="#172b3a">機械 30%</text><rect x="256.0" y="250" width="288.0" height="50" fill="#f3cf95" stroke="white" stroke-width="1"/><text x="400.0" y="281" font-size="16" text-anchor="middle" fill="#172b3a">食品 40%</text><rect x="544.0" y="250" width="216.0" height="50" fill="#d1dcda" stroke="white" stroke-width="1"/><text x="652.0" y="281" font-size="16" text-anchor="middle" fill="#172b3a">その他 30%</text><text x="40" y="355" font-size="18" text-anchor="start" fill="#172b3a">帯全体の長さは各年の100％を表す。総額は年ごとに異なる。</text></g></svg>