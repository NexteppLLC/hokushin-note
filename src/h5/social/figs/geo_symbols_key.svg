<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" role="img" aria-labelledby="geo_symbols_key_title geo_symbols_key_desc"><title id="geo_symbols_key_title">地図記号の資料</title><desc id="geo_symbols_key_desc">自作の学習用模式図・統計。実在地点の測量図や実測統計ではありません。</desc><rect width="800" height="465" fill="white"/><g font-family="Noto Sans CJK JP, Yu Gothic, IPAexGothic, sans-serif"><text x="25" y="30" font-size="22" text-anchor="start" fill="#172b3a">地図記号の資料</text><g transform="translate(85 85) scale(1.25)"><circle cx="0" cy="0" r="12" fill="white" stroke="#172b3a" stroke-width="2"/><circle cx="0" cy="0" r="6" fill="white" stroke="#172b3a" stroke-width="2"/></g><text x="85" y="130" font-size="17" text-anchor="middle" fill="#172b3a">1　市役所</text><g transform="translate(275 85) scale(1.25)"><circle cx="0" cy="0" r="12" fill="white" stroke="#172b3a" stroke-width="2"/><line x1="-8" y1="-8" x2="8" y2="8" stroke="#172b3a" stroke-width="2"/><line x1="-8" y1="8" x2="8" y2="-8" stroke="#172b3a" stroke-width="2"/></g><text x="275" y="130" font-size="17" text-anchor="middle" fill="#172b3a">2　警察署</text><g transform="translate(465 85) scale(1.25)"><path d="M -11 -11 Q -10 0 0 0 Q 10 0 11 -11 M 0 0 L 0 14" stroke="#172b3a" stroke-width="2" fill="none"/></g><text x="465" y="130" font-size="17" text-anchor="middle" fill="#172b3a">3　消防署</text><g transform="translate(655 85) scale(1.25)"><path d="M 12 -12 L 12 0 L -12 0 L -12 12 M -12 -12 L 0 -12 L 0 12 L 12 12" stroke="#172b3a" stroke-width="2" fill="none"/></g><text x="655" y="130" font-size="17" text-anchor="middle" fill="#172b3a">4　寺院</text><g transform="translate(85 205) scale(1.25)"><path d="M -9 -10 L -9 8 M -14 8 L -4 8 M 9 -10 L 9 8 M 4 8 L 14 8" stroke="#172b3a" stroke-width="2" fill="none"/></g><text x="85" y="250" font-size="17" text-anchor="middle" fill="#172b3a">5　田</text><g transform="translate(275 205) scale(1.25)"><path d="M -12 -10 Q -10 4 0 10 Q 10 4 12 -10" stroke="#172b3a" stroke-width="2" fill="none"/></g><text x="275" y="250" font-size="17" text-anchor="middle" fill="#172b3a">6　畑</text><g transform="translate(465 205) scale(1.25)"><circle cx="0" cy="2" r="10" fill="white" stroke="#172b3a" stroke-width="2"/><line x1="0" y1="-8" x2="0" y2="-16" stroke="#172b3a" stroke-width="2"/></g><text x="465" y="250" font-size="17" text-anchor="middle" fill="#172b3a">7　果樹園</text><g transform="translate(655 205) scale(1.25)"><path d="M 0 -13 L -13 10 L 13 10 Z" stroke="#172b3a" stroke-width="2" fill="none"/><circle cx="0" cy="2" r="1.8" fill="#172b3a" stroke="#172b3a" stroke-width="2"/></g><text x="655" y="250" font-size="17" text-anchor="middle" fill="#172b3a">8　三角点</text><g transform="translate(85 325) scale(1.25)"><path d="M -2 -16 L 3 -12 M -15 -7 L 15 -7 M -8 -7 Q -4 6 14 14 M 8 -7 Q 4 6 -14 14" stroke="#172b3a" stroke-width="2" fill="none"/></g><text x="85" y="370" font-size="17" text-anchor="middle" fill="#172b3a">9　小・中学校</text><g transform="translate(275 325) scale(1.25)"><line x1="-12" y1="-10" x2="12" y2="-10" stroke="#172b3a" stroke-width="2"/><line x1="-12" y1="-3" x2="12" y2="-3" stroke="#172b3a" stroke-width="2"/><line x1="0" y1="-3" x2="0" y2="13" stroke="#172b3a" stroke-width="2"/></g><text x="275" y="370" font-size="17" text-anchor="middle" fill="#172b3a">10　郵便局</text><g transform="translate(465 325) scale(1.25)"><circle cx="0" cy="0" r="12" fill="white" stroke="#172b3a" stroke-width="2"/><line x1="-9" y1="0" x2="9" y2="0" stroke="#172b3a" stroke-width="2"/><line x1="0" y1="-9" x2="0" y2="9" stroke="#172b3a" stroke-width="2"/></g><text x="465" y="370" font-size="17" text-anchor="middle" fill="#172b3a">11　病院</text><text x="25" y="435" font-size="16" text-anchor="start" fill="#172b3a">国土地理院の地図記号を参照して作図。形を拡大して表示。</text></g></svg>