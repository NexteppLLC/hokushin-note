<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" role="img" aria-labelledby="geo_japan_farming_title geo_japan_farming_desc"><title id="geo_japan_farming_title">日本の位置図と農業資料</title><desc id="geo_japan_farming_desc">自作の学習用模式図・統計。実在地点の測量図や実測統計ではありません。</desc><rect width="800" height="510" fill="white"/><g font-family="Noto Sans CJK JP, Yu Gothic, IPAexGothic, sans-serif"><text x="25" y="30" font-size="22" text-anchor="start" fill="#172b3a">日本の4地域の位置と農業資料</text><g transform="translate(25 60)"><path d="M 310 10 L 348 28 L 343 54 L 372 80 L 340 100 L 310 76 L 295 40 Z M 302 102 L 317 132 L 299 178 L 274 218 L 250 251 L 210 260 L 184 280 L 156 278 L 125 295 L 84 297 L 92 275 L 151 255 L 170 234 L 226 228 L 248 203 L 273 165 Z M 119 304 L 166 292 L 191 302 L 171 318 L 129 323 Z M 64 303 L 99 313 L 87 348 L 60 371 L 42 337 Z" stroke="#456477" stroke-width="2" fill="#f2f3df"/><line x1="36" y1="70" x2="36" y2="30" stroke="#172b3a" stroke-width="3"/><path d="M 40.283601765395154 40.13167093403173 L 36 30 L 31.716398234604846 40.13167093403173" stroke="#172b3a" stroke-width="3" fill="none"/><text x="36" y="20" font-size="18" text-anchor="middle" fill="#172b3a">北</text><text x="25" y="404" font-size="16" text-anchor="start" fill="#172b3a">位置の模式図（県境は省略）</text></g><circle cx="353" cy="117" r="15" fill="white" stroke="#172b3a" stroke-width="2"/><text x="353" y="123" font-size="18" text-anchor="middle" fill="#172b3a">A</text><circle cx="293" cy="248" r="15" fill="white" stroke="#172b3a" stroke-width="2"/><text x="293" y="254" font-size="18" text-anchor="middle" fill="#172b3a">B</text><circle cx="231" cy="306" r="15" fill="white" stroke="#172b3a" stroke-width="2"/><text x="231" y="312" font-size="18" text-anchor="middle" fill="#172b3a">C</text><circle cx="91" cy="394" r="15" fill="white" stroke="#172b3a" stroke-width="2"/><text x="91" y="400" font-size="18" text-anchor="middle" fill="#172b3a">D</text><rect x="440" y="70" width="335" height="160" fill="#f5f8fa" stroke="#94a3b8" stroke-width="1"/><text x="452" y="96" font-size="17" text-anchor="start" fill="#172b3a">資料1　位置の手がかり</text><text x="452" y="121" font-size="17" text-anchor="start" fill="#172b3a">A：北海道　B：東北地方</text><text x="452" y="146" font-size="17" text-anchor="start" fill="#172b3a">C：中部の内陸高地</text><text x="452" y="171" font-size="17" text-anchor="start" fill="#172b3a">D：九州南部</text><rect x="440" y="255" width="335" height="185" fill="#fff7e9" stroke="#94a3b8" stroke-width="1"/><text x="452" y="281" font-size="17" text-anchor="start" fill="#172b3a">資料2　地域の特徴（模式）</text><text x="452" y="306" font-size="17" text-anchor="start" fill="#172b3a">① 冷涼・広い耕地・畑作と酪農</text><text x="452" y="331" font-size="17" text-anchor="start" fill="#172b3a">② 水田率が高い・米の生産</text><text x="452" y="356" font-size="17" text-anchor="start" fill="#172b3a">③ 標高が高い・夏の葉物野菜</text><text x="452" y="381" font-size="17" text-anchor="start" fill="#172b3a">④ 冬に温暖・冬春の野菜</text></g></svg>